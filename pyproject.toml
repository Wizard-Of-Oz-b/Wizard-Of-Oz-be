[project]
name = "shopapi"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
  "celery>=5.5.3",
  "celery[redis]>=5.5.3",
  "django>=5.2.6",
  "django-cors-headers>=4.8.0",
  "django-filter>=25.1",
  "djangorestframework>=3.16.1",
  "djangorestframework-simplejwt>=5.5.1",
  "drf-spectacular>=0.28.0",
  "pillow>=11.3.0",
  "psycopg[binary]>=3.2.10",
  "whitenoise>=6.10.0",
  "gunicorn>=21.2",
  "uvicorn==0.30.*",
  "django-celery-beat>=2.8.1",
  # 트래킹 프록시 때문에 컨테이너 안에서 수동 설치했던 것들 정식 반영
  "httpx>=0.27,<0.28",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.31,<3.0",
  "django-stubs>=5.2.5",
  "djangorestframework-stubs>=3.16.4",
  "django-filter-stubs>=0.1.3",
  "types-requests>=2.32.4.20250913",
  "types-python-dateutil>=2.9.0.20250822",
  "types-pytz>=2025.2.0.20250809",
]

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-django>=4.11.1",
  "pytest-xdist>=3.8.0",
  # Code quality tools
  "black>=24.0.0",
  "isort>=5.13.0",
  "flake8>=7.0.0",
  "bandit>=1.7.0",
  "pre-commit>=3.6.0",
  # Type checking
  "mypy>=1.8.0",
  "django-stubs>=4.2.0",
  "djangorestframework-stubs>=3.14.0",
  "types-requests>=2.31.0",
  "autoflake>=2.3.1",
  "autopep8>=2.3.2",
]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_django = "django"
known_first_party = ["domains", "config", "shared", "api"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["*/migrations/*"]
force_single_line = false
combine_as_imports = true
force_grid_wrap = 0

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "*/migrations/*",
    ".venv",
    "build",
    "dist",
    "venv",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_return_any = false
show_error_codes = true
exclude = [
    "migrations/",
    "tests/",
    ".venv/",
]

[mypy.plugins.django-stubs]
django_settings_module = "config.settings"

# domains 내부만 타입 강화
["mypy.domains.*"]
disallow_untyped_defs = true

# Django 설정
[tool.django-stubs]
django_settings_module = "config.settings"

# 모듈별 설정 (점진적 적용)
[[tool.mypy.overrides]]
module = [
    "domains.*.migrations.*",
    "tests.*",
    "celery.*",
    "requests.*",
    "PIL.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [
    ".venv",
    "tests",
    "migrations",
    "*/site-packages/*",
]

# 오탐이 많은 규칙만 최소한으로 제외
skips = [
    "B101", # assert 사용
    "B601", # paramiko, subprocess 경고 과잉
    "B404", # subprocess import 경고
    "B603", # subprocess Popen 관련 과잉
    "B113", # requests timeout 미설정 (테스트 코드용)
]
